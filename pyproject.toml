[project]
name = "habits-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=5.1,<6.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "eventlet (>=0.41.2,<0.42.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "coverage (>=7.16.0,<8.0.0)",
    "django-filter (>=26.1,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
django = ">=5.0,<6.0"
celery = "^5.3"
django-timezone-field = { version = ">=5.0,<8.0", markers = "python_version >= '3.12' and python_version < '4.0'" }

